name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TypeIt4Me.sln

      - name: Build
        run: dotnet build TypeIt4Me.sln -c Release --no-restore

      - name: Test
        run: dotnet test TypeIt4Me.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

      - name: Publish single-file exe
        run: dotnet publish TypeIt4Me.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TypeIt4Me
          path: publish/TypeIt4Me.exe
          retention-days: 5
