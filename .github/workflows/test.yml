name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    # Local Windows VM runner (dev-win11-typeit4me -- dev's win11 libvirt guest,
    # dotnet SDK 8.0.419). This job CANNOT move to the Linux dev-pool: the test
    # project is net8.0-windows + UseWPF, so testhost needs
    # Microsoft.WindowsDesktop.App, which a Linux runner does not have.
    # Previously windows-latest, which spends GitHub-hosted minutes -- one
    # monthly cap shared across every repo on the account. Exhausting it blocked
    # CI on four repos at once on 2026-08-23.
    runs-on: [self-hosted, windows, x64, dev-pool, typeit4me]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
        env:
          # The runner service runs as NT AUTHORITY\NETWORK SERVICE, which cannot
          # write C:\Program Files\dotnet -- setup-dotnet's default install root.
          # Without this the step dies with "The current user doesn't have write
          # access to the installation root". Install into the runner's own tree
          # instead: writable by the service account, and persistent across jobs
          # so the SDK is downloaded once rather than every run.
          DOTNET_INSTALL_DIR: C:\actions-runner\dotnet

      - name: Restore
        run: dotnet restore TypeIt4Me.sln

      - name: Build
        run: dotnet build TypeIt4Me.sln -c Release --no-restore

      - name: Test
        run: dotnet test TypeIt4Me.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

      - name: Publish single-file exe
        run: dotnet publish TypeIt4Me.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TypeIt4Me
          path: publish/TypeIt4Me.exe
          retention-days: 5
