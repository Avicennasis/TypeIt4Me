name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TypeIt4Me.sln

      - name: Build
        run: dotnet build TypeIt4Me.sln -c Release --no-restore

      - name: Test
        run: dotnet test TypeIt4Me.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: dotnet publish TypeIt4Me.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d # v3
        with:
          files: publish/TypeIt4Me.exe
          generate_release_notes: true
