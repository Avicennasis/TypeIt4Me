name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TypeIt4Me.sln

      - name: Build
        run: dotnet build TypeIt4Me.sln -c Release --no-restore

      - name: Test
        run: dotnet test TypeIt4Me.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: dotnet publish TypeIt4Me.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/TypeIt4Me.exe
          generate_release_notes: true
