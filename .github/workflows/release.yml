name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TypeIt4Me.sln

      - name: Build
        run: dotnet build TypeIt4Me.sln -c Release --no-restore

      - name: Test
        run: dotnet test TypeIt4Me.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: dotnet publish TypeIt4Me.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: publish/TypeIt4Me.exe
          generate_release_notes: true
